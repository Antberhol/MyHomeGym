name: Release

# Se lanza al subir una etiqueta de versión, por ejemplo: git tag -a v1.0.0-beta.1 -m "..." && git push origin v1.0.0-beta.1
# Pasa las mismas comprobaciones que la CI, construye el .jar con la interfaz dentro y publica la release en GitHub.
# Las versiones con guion (1.0.0-beta.1, 1.1.0-rc.1) se publican como "pre-release".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Comprobar que la etiqueta coincide con la versión del proyecto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FRONTEND=$(node -p "require('./frontend/package.json').version")
          BACKEND=$(cd backend && ./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Etiqueta $VERSION · frontend $FRONTEND · backend $BACKEND"
          test "$VERSION" = "$FRONTEND" && test "$VERSION" = "$BACKEND"
          test -f "docs/release-notes/v$VERSION.md"

      - name: Frontend (lint, tests, traducciones y build dentro del backend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run check:i18n
          npm run build:backend

      - name: Backend (tests y .jar)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="myhomegym-$VERSION.jar"
          cp "backend/target/myhomegym-backend-$VERSION.jar" "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" \
            --title "MyHomeGym $VERSION" \
            --notes-file "docs/release-notes/v$VERSION.md" \
            --verify-tag $PRERELEASE
